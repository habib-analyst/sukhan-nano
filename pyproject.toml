[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sukhan-nano"
version = "0.1.0"
description = "Sukhan-Nano: a tiny from-scratch Urdu language model (5-6M-param GPT, own BPE tokenizer) trained on a documented CC BY-SA / public-domain corpus — an educational, fully reproducible showcase artifact."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
